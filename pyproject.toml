[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-strategy-intelligence"
version = "0.1.0"
description = "F1 2026 race strategy intelligence platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastf1>=3.4",
  "numpy>=2.0",
  "pandas>=2.2",
  "prefect>=3.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "requests>=2.32",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
